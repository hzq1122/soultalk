name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FLUTTER_VERSION: '3.44.1'

jobs:
  # ── Static Analysis ──────────────────────────────────────────────
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies (root)
        run: flutter pub get

      - name: Install dependencies (pc)
        run: cd pc && flutter pub get

      - name: Run dart analyze (root)
        run: dart analyze . --fatal-infos

      - name: Run dart analyze (pc)
        run: cd pc && dart analyze . --fatal-infos

  # ── Tests ────────────────────────────────────────────────────────
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies (root)
        run: flutter pub get

      - name: Install dependencies (pc)
        run: cd pc && flutter pub get

      - name: Run tests (root)
        run: |
          flutter test --coverage 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Report failing tests as annotations
        if: failure()
        run: |
          # 通道 0：诊断文件本身
          echo "::error file=test-output.log,line=1::log_size=$(wc -c < test-output.log) bytes"
          # 通道 1：失败标记行（GitHub reporter 用 ❌/✗ 标记失败测试；含 [E]、Some tests failed 等）
          grep -nE '❌|✗|\[E\]|Some tests failed|failed|Failed' test-output.log | head -60 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | while IFS= read -r line; do echo "::error file=test-output.log,line=1::$line"; done
          # 通道 2：写入 job summary（Actions 页面可见）
          {
            echo "## Flutter Test 失败详情"
            echo '```'
            grep -nE '❌|✗|\[E\]|Some tests failed|failed|Failed' test-output.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore

      - name: Run tests (pc)
        run: cd pc && flutter test

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/lcov.info

  # ── Format Check ─────────────────────────────────────────────────
  format:
    name: Dart Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Check formatting (root)
        run: dart format --set-exit-if-changed .

      - name: Check formatting (pc)
        run: cd pc && dart format --set-exit-if-changed .

  # ── Determine Version from pubspec.yaml ──────────────────────────
  # 版本号以 pubspec.yaml 为唯一权威（每次发布前手动 bump），
  # main 分支每次编译成功后用该版本自动创建/更新 Release（allowUpdates 覆盖）。
  version-info:
    name: Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d "'\"")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version=$VERSION"

  # ── Android APK Build ────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [analyze, test, format, version-info]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # 发布签名：从 GitHub Secrets 恢复 keystore。
      # 仓库需配置 ANDROID_KEYSTORE_BASE64（base64 编码的 .jks/.keystore）、
      # ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD；
      # 未配置时回退 debug 签名（Release 说明中会标注 debug-signed 测试包）。
      - name: Set up release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > android/key.properties
            echo "Release keystore configured"
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set — APK will use debug signing"
          fi

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ── PC Windows Build (pc 子项目) ────────────────────────────────
  build-pc-windows:
    name: PC Windows x64
    runs-on: windows-latest
    needs: [analyze, test, format, version-info]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build PC Windows
        shell: pwsh
        run: |
          cd pc
          flutter pub get *> ..\pc-pub-get.log
          flutter build windows --release 2>&1 | Tee-Object -FilePath ..\pc-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pc-build-logs
          path: |
            pc-pub-get.log
            pc-build.log
          if-no-files-found: ignore

      - name: Package PC build
        shell: pwsh
        run: |
          $version = "${{ needs.version-info.outputs.version }}"
          $zipName = "soultalk-pc-windows-x64-v$version.zip"
          Compress-Archive -Path pc\build\windows\x64\runner\Release\* -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_ENV

      - name: Upload PC artifact
        uses: actions/upload-artifact@v5
        with:
          name: pc-windows-x64
          path: soultalk-pc-windows-x64-*.zip

  # ── SoulTalk 主项目 Windows 桌面构建 ────────────────────────────
  build-windows-app:
    name: App Windows x64
    runs-on: windows-latest
    needs: [version-info]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter pub get *> pub-get.log
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: windows-build-logs
          path: |
            pub-get.log
            build-release.log
          if-no-files-found: ignore

      - name: Package release build
        shell: pwsh
        run: |
          $version = "${{ needs.version-info.outputs.version }}"
          $zipName = "soultalk-windows-x64-v$version.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-windows-x64
          path: soultalk-windows-x64-*.zip

  # ── Release（main 每次编译成功自动发布 / v-tag 手动发布）─────────
  release:
    name: Create GitHub Release
    needs: [build-android, build-pc-windows, build-windows-app, version-info]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 仅 release job 需要写权限（创建 Release）
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Compute SHA256 checksums
        run: |
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' \) -exec sha256sum {} + > checksums.sha256
          cat checksums.sha256

      - name: Create Release
        # 固定 commit SHA 而非可变 tag
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifacts: |
            artifacts/android-apk/*.apk
            artifacts/pc-windows-x64/*.zip
            artifacts/app-windows-x64/*.zip
            checksums.sha256
          tag: v${{ needs.version-info.outputs.version }}
          name: SoulTalk v${{ needs.version-info.outputs.version }}
          body: |
            > [!NOTE]
            > 本 Release 由 GitHub Actions 在每次 main 分支编译成功后自动生成/更新。
            > Android APK 在未配置 ANDROID_KEYSTORE_BASE64 secrets 时为 **debug-signed 测试包**，
            > 配置正式 keystore 后将自动切换正式签名。

            - 版本号以 `pubspec.yaml` 为准：v${{ needs.version-info.outputs.version }}
            - 产物：Android APK、PC Windows x64 zip、主应用 Windows x64 zip
            - 校验：`checksums.sha256` 为全部产物的 SHA256 摘要
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
          makeLatest: true
